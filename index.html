<!DOCTYPE html>
<html lang="en" data-pal="stadium"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111614">
<title>Gut Check</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: the film-room — dense, numeric, everything on one board for someone who wants control.
   IDEA: the coach's chalkboard — chalk-white tables on slate green, yellow chalk for what matters.
   PICTURE: the tables themselves: a weights grid with live results, a typed line sheet, a sortable standings table.
   COLOUR and TYPE: slate green #1d2a24, chalk #eef1ea, yellow chalk #ffd84a; Archivo Narrow figures, Archivo text.
   LAYOUT: top tab strip, sticky live readout, compact tables that scroll sideways only when they must. */
:root{color-scheme:dark;--bg:#090d0b;--bg2:#1e2924;--btn:#2d3b34;--ink:#f1f3ee;--mute:#a3b0a8;--rule:rgba(241,243,238,.14);--edge:rgba(241,243,238,.38);--yel:#ffd84a;--win:#7ee2a2;--loss:#ff9b8f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
.num,h1,h2{font-family:"Archivo Narrow","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}
header{padding:calc(12px + env(safe-area-inset-top)) 14px 0;max-width:1100px;margin:0 auto}
header h1{font-size:30px}header h1 span{color:var(--yel)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-top:10px;overflow-x:auto}
.tabs button{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--mute);min-height:46px;padding:0 14px;font:700 16px "Archivo Narrow",sans-serif}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--yel)}
main{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
button,select,input{font:600 16px Archivo,sans-serif;min-height:44px;border-radius:8px;border:1.5px solid var(--edge);background:var(--btn);color:var(--ink);padding:0 12px}
button{cursor:pointer}button.y{background:var(--yel);color:var(--on);border-color:var(--yel)}button:disabled{opacity:.45}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
h2{font-size:22px;margin:18px 0 8px}
.note{color:var(--mute);font-size:14px;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.ro{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ro div{background:var(--bg2);border-radius:8px;padding:6px 8px}.ro .num{font-size:22px;white-space:nowrap}.ro span{display:block;font-size:12px;color:var(--mute)}
.good{color:var(--win)}.bad{color:var(--loss)}.yel{color:var(--yel)}
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.w{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.stp{display:flex;align-items:center;gap:4px}.stp button{width:44px;padding:0;font-size:22px;line-height:1}
.wbar{display:block;height:4px;background:var(--rule);border-radius:2px;margin-top:5px;overflow:hidden;max-width:180px}.wbar i{display:block;height:100%;background:var(--yel)}
.w .rk{color:var(--mute);font:700 14px "Archivo Narrow",sans-serif;text-align:right}.w small{display:block;color:var(--mute);font-size:12px}
.w input{width:52px;text-align:center;padding:0 2px;font:700 18px "Archivo Narrow",sans-serif}
.gh{grid-column:1/-1;color:var(--yel);font:700 15px "Archivo Narrow",sans-serif;margin-top:10px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font:600 12px Archivo,sans-serif;color:var(--mute);white-space:nowrap}th button{all:unset;cursor:pointer}th button:focus-visible{outline:2px solid var(--yel)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.ls td{vertical-align:middle}.ls input{width:82px;text-align:center;font:700 18px "Archivo Narrow",sans-serif;padding:0 4px}
.ls .m{font:700 18px "Archivo Narrow",sans-serif;white-space:nowrap}.ls small{display:block;color:var(--mute);font-size:12px}
details{font-size:13px;color:var(--mute)}summary{cursor:pointer;min-height:24px}details ul{margin:4px 0;padding-left:16px}details em{font-style:normal;color:var(--loss)}
.res{font:700 13px "Archivo Narrow",sans-serif;padding:1px 6px;border-radius:3px;margin-left:4px;color:#111614}.res.W{background:var(--win)}.res.L{background:var(--loss)}.res.P{background:var(--mute)}
tr.me td{background:rgba(255,216,74,.08)}
.gap{display:inline-block;height:8px;background:var(--yel);border-radius:2px;vertical-align:middle;margin-right:6px}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:2px 0 8px;scrollbar-width:none}.deck::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:center;background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:16px}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}.dots i.set{background:var(--ink)}.dots i.on{background:var(--yel)}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;text-align:center;gap:6px;margin:8px 0 12px}
.match .num{font-size:40px}.match small{display:block;color:var(--mute);font-size:13px}
.fav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.fav button{min-height:52px;font:700 19px "Archivo Narrow",sans-serif}.fav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dial{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:8px;margin-top:10px}.dial button{width:64px;min-height:64px;border-radius:50%;font-size:30px;padding:0}
.dial output{text-align:center;font:700 46px "Archivo Narrow",sans-serif;color:var(--yel)}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}.quick button{min-height:38px;border-radius:999px;font-size:15px}
.injg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:13px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}.injg b{display:block;font-size:14px}.injg ul{list-style:none;margin:2px 0 0;padding:0;color:var(--mute)}.injg em{font-style:normal;color:var(--loss)}
.act{position:sticky;bottom:0;z-index:4;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--rule);margin-top:10px}
.act .y{font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{flex:none;border-radius:999px;min-height:40px}.chips button[aria-pressed=true]{background:var(--yel);color:var(--on);border-color:var(--yel)}
@media(max-width:420px){.injg{grid-template-columns:minmax(0,1fr)}.match .num{font-size:34px}}
.gl{list-style:none;margin:8px 0 0;padding:0}
.gi{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px}
.gi .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gi .num{font-size:24px}.gi small{color:var(--mute);font-size:13px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr) 44px 78px 44px;gap:5px;margin-top:8px;align-items:center}
.ctl .f{min-height:46px;padding:0 4px;font:700 18px "Archivo Narrow",sans-serif;background:var(--btn);border-color:var(--edge)}.ctl .f[aria-pressed=true]{background:var(--yel);color:var(--on);border-color:var(--yel);box-shadow:0 0 0 3px color-mix(in srgb,var(--yel) 30%,transparent)}
.ctl .st{padding:0;font-size:24px;background:transparent}.ctl output{text-align:center;font:700 24px "Archivo Narrow",sans-serif;color:var(--yel);white-space:nowrap}
.gi details{margin-top:6px}.gi summary{display:inline-flex;align-items:center;min-height:36px;color:var(--yel);font-weight:600;list-style:none}.gi summary::-webkit-details-marker{display:none}
.gi details[open] summary .pl{display:none}.gi details:not([open]) summary .mi{display:none}
.ir{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:13px;padding:6px 0 2px}.ir b{display:block;font-size:14px;color:var(--ink)}.ir ul{list-style:none;margin:2px 0 0;padding:0;color:var(--mute)}.ir em{font-style:normal;color:var(--loss)}
.prog{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--yel)}
@media(max-width:400px){.ctl{grid-template-columns:repeat(3,minmax(0,1fr))}.ctl .st,.ctl output{grid-row:2}.ctl output{grid-column:2}.ir{grid-template-columns:minmax(0,1fr)}}
.stick{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
.stick thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--headink);font:700 14px "Archivo Narrow",sans-serif;padding:10px 6px;border-bottom:2px solid var(--yel);white-space:normal;line-height:1.1}
.stick thead th:first-child{border-top-left-radius:8px}.stick thead th:last-child{border-top-right-radius:8px}
.stick thead th small{display:block;font:500 11px Archivo,sans-serif;color:var(--headink);opacity:.7}
.stick td{padding:10px 6px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.stick tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.stick .m{font-size:18px}

:root[data-pal=stadium]{color-scheme:dark;--bg:#0b0d10;--bg2:#232831;--btn:#313845;--ink:#f4f6f8;--mute:#a7b0bd;--rule:rgba(244,246,248,.12);--edge:rgba(244,246,248,.42);--yel:#ff8a1f;--on:#15171c;--head:#0c0e12;--headink:#f4f6f8;--win:#6ee7a0;--loss:#ff8f8f}
:root[data-pal=chalk]{color-scheme:dark;--bg:#090d0b;--bg2:#1e2924;--btn:#2d3b34;--ink:#f1f3ee;--mute:#a3b0a8;--rule:rgba(241,243,238,.14);--edge:rgba(241,243,238,.38);--yel:#ffd84a;--on:#111614;--head:#0b0f0d;--headink:#f1f3ee;--win:#7ee2a2;--loss:#ff9b8f}
:root[data-pal=turf]{color-scheme:dark;--bg:#082615;--bg2:#165434;--btn:#1f6a42;--ink:#ffffff;--mute:#bcd8c6;--rule:rgba(255,255,255,.16);--edge:rgba(255,255,255,.5);--yel:#ffffff;--on:#0e3a22;--head:#0a2c19;--headink:#ffffff;--win:#a6f3c0;--loss:#ffb4a8}
:root[data-pal=day]{color-scheme:light;--bg:#d9dee5;--bg2:#ffffff;--btn:#f3f5f8;--ink:#121820;--mute:#5a6676;--rule:rgba(18,24,32,.12);--edge:rgba(18,24,32,.32);--yel:#0b5cd6;--on:#ffffff;--head:#121820;--headink:#ffffff;--win:#127a45;--loss:#c62828}
.pal{margin-left:auto}.pal select{min-height:36px;font-size:14px;padding:0 8px}
header .hr{display:flex;align-items:center;gap:10px}

:root[data-pal=concrete]{color-scheme:light;--bg:#aeb4bb;--bg2:#f4f5f6;--btn:#ffffff;--ink:#0a0a0a;--mute:#3c4249;--rule:rgba(0,0,0,.16);--edge:rgba(0,0,0,.6);--yel:#d0141c;--on:#ffffff;--head:#0a0a0a;--headink:#ffffff;--win:#0c6a32;--loss:#b0101a}
:root[data-pal=contrast]{color-scheme:dark;--bg:#000000;--bg2:#141414;--btn:#000000;--ink:#ffffff;--mute:#e6e6e6;--rule:rgba(255,255,255,.4);--edge:#ffffff;--yel:#ffe600;--on:#000000;--head:#000000;--headink:#ffffff;--win:#5dff8f;--loss:#ff6b6b}
:root[data-pal=contrast] button,:root[data-pal=contrast] select,:root[data-pal=contrast] input,:root[data-pal=contrast] .gi{border-width:2px}
:root[data-pal=concrete] .gi{box-shadow:0 1px 2px rgba(0,0,0,.18)}
.pals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pals button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;min-height:76px;text-align:left}
.pals button[aria-pressed=true]{outline:3px solid var(--yel);outline-offset:1px}
.sw{display:flex;gap:4px}.sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(128,128,128,.5)}
.set{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-top:12px}
.set h2{margin:0 0 8px}.set .row+.row{margin-top:8px}
.danger{border-color:var(--loss);color:var(--loss)}
.segc{display:flex;gap:4px;flex-wrap:wrap}.segc button{flex:1 1 auto;min-height:40px;font-size:15px;padding:0 10px}.segc button[aria-pressed=true]{background:var(--yel);color:var(--on);border-color:var(--yel)}
.opt{margin-top:10px}.opt .note{margin:0 0 4px}
.shop{display:block;margin-top:3px;color:var(--ink)!important}.shop .pr{color:var(--mute)}.shop .gain{color:var(--win);font-weight:700}
.bkl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}.bk{display:flex;align-items:center;gap:8px;min-height:40px}.bk input{width:22px;height:22px;min-height:0;accent-color:var(--yel)}
.ls td small{display:block}
.ls tr.sub td{padding-top:0;border-bottom:1px solid var(--rule)}.ls tr[data-g]:not(.sub) td{border-bottom:0}
.why{margin:0 0 8px;font-size:14px;color:var(--mute)}.why b{color:var(--ink)}
.dec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dec button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 16px "Archivo Narrow",sans-serif;padding:4px}
.dec button small{font:500 12px Archivo,sans-serif;color:var(--mute);display:block}.dec button[aria-pressed=true]{background:var(--yel);color:var(--on);border-color:var(--yel)}.dec button[aria-pressed=true] small{color:var(--on)}
.units{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}.units button{min-height:36px;padding:0 12px;font-size:14px}.units button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.locked .m{font-size:17px}.locked small{display:block;color:var(--mute);font-size:13px}

.rc{background:var(--bg2);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px}
.rc.bet{border-left-color:var(--yel);background:color-mix(in srgb,var(--yel) 9%,var(--bg2))}
.rc.fade{border-left-color:var(--fadec);background:color-mix(in srgb,var(--fadec) 10%,var(--bg2))}
.rc.pass{border-left-color:var(--mute);opacity:.82}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.rh .num{font-size:22px}
.gapb{font:700 22px "Archivo Narrow",sans-serif;color:var(--yel);white-space:nowrap}.gapb small{font:600 12px Archivo,sans-serif;color:var(--mute)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.pill{display:flex;flex-direction:column;align-items:flex-start;border-radius:10px;padding:6px 10px;font:700 21px "Archivo Narrow",sans-serif;line-height:1.1;white-space:nowrap}
.pill small{font:700 11px Archivo,sans-serif;letter-spacing:.02em;opacity:.85}
.pill.you{background:var(--yel);color:var(--on)}
.pill.vegas{background:transparent;color:var(--ink);border:2px solid var(--edge)}
.legend{display:flex;gap:8px;margin:6px 0 12px}.legend .pill{flex-direction:row;align-items:center;gap:6px;font:600 13px Archivo,sans-serif;padding:4px 10px}
.why{margin:4px 0 8px;font-size:14px}.why b{color:var(--ink)}
.out{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.out .m{font:700 19px "Archivo Narrow",sans-serif}
.units{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;align-items:center}
.grp{margin-top:14px}
.gh2{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;padding:10px 12px;border-radius:10px;font:700 18px "Archivo Narrow",sans-serif;background:var(--head);color:var(--headink);border-left:5px solid var(--mute)}
.gh2 small{font:600 13px Archivo,sans-serif;opacity:.8}
.grp.bet .gh2{border-left-color:var(--yel)}.grp.fade .gh2{border-left-color:var(--fadec)}

/* decision colors: bet = green, fade = purple, pass = red */
:root{--betc:#2fbf71;--fadec:#a78bfa;--passc:#f0565b}
:root[data-pal=day],:root[data-pal=concrete]{--betc:#14833f;--fadec:#6d3fd6;--passc:#c62828}
:root[data-pal=turf]{--betc:#7cf0a8}
.gi,.rc{box-shadow:0 2px 10px rgba(0,0,0,.35)}
:root[data-pal=day] .gi,:root[data-pal=day] .rc,:root[data-pal=concrete] .gi,:root[data-pal=concrete] .rc{box-shadow:0 2px 8px rgba(0,0,0,.14)}
.rc.bet{border-left-color:var(--betc);background:color-mix(in srgb,var(--betc) 12%,var(--bg2))}

.dec button[data-dec=fade][aria-pressed=true]{background:var(--fadec);border-color:var(--fadec);color:#fff}
.dec button[data-dec=pass][aria-pressed=true]{background:var(--passc);border-color:var(--passc);color:#fff}
.dec button[aria-pressed=true] small{color:#fff!important;opacity:.9}
.grp.bet .gh2{border-left-color:var(--betc)}.grp.fade .gh2{border-left-color:var(--fadec)}.grp.pass .gh2{border-left-color:var(--passc)}
.rc.bet .gh2,.grp.bet .gh2 span:first-child{color:var(--headink)}
.best2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.best2 div{font-size:13px;color:var(--mute);border:1px dashed var(--edge);border-radius:8px;padding:5px 8px;line-height:1.25}

.rc details{margin:2px 0 8px}.rc summary{display:inline-flex;align-items:center;min-height:36px;color:var(--yel);font-weight:600;list-style:none;cursor:pointer}.rc summary::-webkit-details-marker{display:none}
.rc details[open] summary .pl{display:none}.rc details:not([open]) summary .mi{display:none}

.team[aria-pressed=true]{border-color:var(--yel);box-shadow:0 0 0 3px color-mix(in srgb,var(--yel) 35%,transparent);background:color-mix(in srgb,var(--yel) 10%,var(--btn))}
.team[aria-pressed=true] .tn span{color:var(--ink)}

.pbar{height:8px;border-radius:4px;background:var(--btn);overflow:hidden}.pbar i{display:block;height:100%;background:var(--yel)}

<script>window.GC_BUILD='dde5ee26b8';

 fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{

<script>{
const L=LineLab,$=s=>document.querySelector(s),E=L.esc;
let view='gut',idx=0,pickId=null,pickWk=null,prof=null,win='all',minE=0,gutWk=null,sortK='pct';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)};
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render()}});

function readout(r){return `<div class="ro" aria-live="polite"><div><div class="num ${r.pct>=r.be?'good':'bad'}">${L.pct(r.pct)}</div><span>ATS win %</span></div><div><div class="num">${L.rec(r)}</div><span>record</span></div><div><div class="num ${r.units>=0?'good':'bad'}">${r.units>0?'+':''}${r.units}</div><span>units</span></div><div><div class="num">${L.pct(r.suPct)}</div><span>winners</span></div><div><div class="num">${r.mae}</div><span>avg miss</span></div></div>`}

function build(){
 const D=L.D,all=L.store.profiles(); if(!prof)prof=JSON.parse(JSON.stringify(all[0]));
 const r=L.backtest(prof,{window:win,minEdge:minE});
 const picks=L.picks(prof,D.current_week).filter(x=>x.edge!=null).sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge));
 const weeks=r.weekList.slice(-12).reverse();
 return `${readout(r)}
 <div class="row" style="margin-top:10px"><select id="pSel" class="sp" aria-label="Playbook">${all.map(p=>`<option value="${E(p.id)}" ${p.id===prof.id?'selected':''}>${E(p.name)}${p.builtin?' — starter':''}</option>`).join('')}</select>
 <input id="pName" value="${E(prof.name)}" aria-label="Playbook name" placeholder="Name this playbook" class="sp"><button class="y" id="save">Save</button><button id="new">New</button>${prof.builtin?'':'<button id="del">Delete</button>'}</div>
 <div class="row" style="margin-top:8px"><label for="win" class="note">Test on</label><select id="win"><option value="all" ${win==='all'?'selected':''}>2023 – now</option><option value="season" ${win==='season'?'selected':''}>This season</option></select>
 <label for="minE" class="note">Min edge</label><input id="minE" type="number" inputmode="decimal" min="0" max="10" step="0.5" value="${minE}" style="width:76px">
 <button id="eq">All = 5</button><button id="zero">All = 0</button></div>
 <div class="opt"><p class="note">Spread scale — "Model" keeps the formula's cautious margins (leans toward underdogs); "Match market" stretches them to the same range as real lines.</p><div class="segc" role="group" aria-label="Spread scale"><button data-opt="scale" data-val="" aria-pressed="${!prof.scale}">Model</button><button data-opt="scale" data-val="market" aria-pressed="${prof.scale==='market'}">Match market</button></div></div>
 <div class="opt"><p class="note">Bet on</p><div class="segc" role="group" aria-label="Which games to bet"><button data-opt="only" data-val="" aria-pressed="${!prof.only}">All games</button><button data-opt="only" data-val="dog" aria-pressed="${prof.only==='dog'}">Underdogs only</button><button data-opt="only" data-val="roaddog" aria-pressed="${prof.only==='roaddog'}">Road underdogs</button></div></div>
 <p class="note" style="margin-top:8px">This playbook bets the underdog in <b>${L.pct(r.dogPct)}</b> of its picks.</p>
 <h2>Weights <span class="note">0–10, ranked by predictive power</span></h2>
 <div class="wg">${['Results','Offense','Defense'].map(gr=>`<div class="gh">${gr}</div>`+D.stats.filter(s=>s.group===gr).map(s=>`<div class="w"><span class="rk">${s.rank}</span><label for="w_${s.key}">${E(s.short)}<small>${E(s.label)} · r ${s.r.toFixed(2)}</small><span class="wbar" aria-hidden="true"><i style="width:${(prof.w[s.key]||0)*10}%"></i></span></label><span class="stp"><button data-st="${s.key}" data-d="-1" aria-label="Less weight on ${E(s.short)}">−</button><input id="w_${s.key}" data-k="${s.key}" type="number" inputmode="numeric" min="0" max="10" step="1" value="${prof.w[s.key]||0}"><button data-st="${s.key}" data-d="1" aria-label="More weight on ${E(s.short)}">+</button></span></div>`).join('')).join('')}
 <div class="gh">Injuries</div><div class="w"><span class="rk">+</span><label for="w_inj">Injury impact ×<small>1 = calibrated to past results</small></label><span class="stp"><button data-st="inj" data-d="-1" aria-label="Less injury weight">−</button><input id="w_inj" type="number" inputmode="decimal" min="0" max="2" step="0.25" value="${prof.inj??1}"><button data-st="inj" data-d="1" aria-label="More injury weight">+</button></span></div></div>
 <details style="margin-top:18px"><summary class="yel" style="font-weight:600;min-height:44px;display:flex;align-items:center">How the 20 stats were chosen</summary>${stats()}</details>`;
}
function bindBuild(){
 $('#pSel').onchange=e=>{prof=JSON.parse(JSON.stringify(L.store.profiles().find(p=>p.id===e.target.value)));render()};
 $('#new').onclick=()=>{prof={id:null,name:'My playbook',w:Object.fromEntries(L.D.keys.map(k=>[k,5])),inj:1};render()};
 $('#eq').onclick=()=>{L.D.keys.forEach(k=>prof.w[k]=5);render()};$('#zero').onclick=()=>{L.D.keys.forEach(k=>prof.w[k]=0);render()};
 $('#save').onclick=()=>{prof.name=$('#pName').value.trim()||'My playbook';if(prof.builtin&&prof.name===L.D.presets.find(p=>p.id===prof.id)?.name)prof.name+=' (mine)';prof=L.store.upsertProfile(prof);pickId=prof.id;toast(L.store.synced()?'Saved to your account':'Saved on this device');render()};
 const d=$('#del');if(d)d.onclick=()=>{L.store.deleteProfile(prof.id);prof=null;render()};
 $('#win').onchange=e=>{win=e.target.value;render()};$('#minE').onchange=e=>{minE=Math.max(0,+e.target.value||0);render()};
 $('#pName').oninput=e=>prof.name=e.target.value;
 document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const y=scrollY;prof[b.dataset.opt]=b.dataset.val||undefined;render();scrollTo(0,y)});
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const k=b.dataset.st,d=+b.dataset.d,y=scrollY;if(k==='inj')prof.inj=Math.max(0,Math.min(2,Math.round(((prof.inj??1)+0.25*d)*100)/100));else prof.w[k]=Math.max(0,Math.min(10,(prof.w[k]||0)+d));render();scrollTo(0,y)});
 document.querySelectorAll('.w input').forEach(i=>i.onchange=()=>{const y=scrollY,id=i.id;if(id==='w_inj')prof.inj=Math.max(0,Math.min(2,+i.value||0));else prof.w[i.dataset.k]=Math.max(0,Math.min(10,Math.round(+i.value||0)));render();scrollTo(0,y);const n=document.getElementById(id);if(n)n.focus()});
}

let SHOWSC=false;try{SHOWSC=localStorage.getItem('gc.scores')==='1'}catch(e){}
function scoreRow(g){
 if(g.m==null) return '';
 const aw=g.as_>g.hs,hw=g.hs>g.as_;
 return `<div class="score"><span>FINAL</span><span class="${aw?'w':''}">${badge(g.a,1)} ${E(g.a)} ${g.as_}</span><span class="${hw?'w':''}">${badge(g.h,1)} ${E(g.h)} ${g.hs}</span></div>`;
}
function verdict(g,v){
 if(g.m==null||v==null) return '';
 const r=L.closerOne(g,v),f=x=>x===0?'exact':x+' off';
 if(r.nailed) return `<div class="cv nail"><b>Nailed it!</b><span>Your line was the exact final margin · Vegas ${f(r.vegas)}</span></div>`;
 const t=r.who==='you'?'<b>You beat Vegas ✓</b>':r.who==='vegas'?'<b>Vegas was closer</b>':'<b>Dead even</b>';
 return `<div class="cv ${r.who}">${t}<span>You ${f(r.you)} · Vegas ${f(r.vegas)}</span></div>`;
}
function clvLine(g,v){
 const x=L.clvOne(g,v); if(x==null) return '';
 const gl={...g,l:g.cl},side=L.betSide(g,v);
 return `<p class="clv">Closing line ${E(L.betText(gl,side))} · ${x>0?`<span class="up">you beat the close by ${x}</span>`:x<0?`<span class="dn">line moved against you by ${-x}</span>`:'no movement'}</p>`;
}

function gut(){
 const D=L.D; if(gutWk==null)gutWk=D.current_week;
 const wks=L.weeks().filter(w=>L.weekGames(w).some(g=>g.l!=null)).reverse();
 const gut=L.store.gut(),games=L.weekGames(gutWk).filter(g=>g.l!=null),live=gutWk>=D.current_week,MP=L.predict(L.D.presets[0]);
 const rec=t=>(D.records[t]||[0,0]).slice(0,2).join('–');
 const st=g=>{const v=gut.picks[g.id];return !v?'A':L.isLk(gut,g,v)?'D':L.isRev(gut,g,v)?'C':'B'};
 const showScore=g=>g.m!=null&&(live||SHOWSC||st(g)==='D');
 const chips=`<div class="chips" role="group" aria-label="Week" style="margin-top:8px">${wks.map(w=>`<button data-wk="${w}" aria-pressed="${w===gutWk}">Wk ${w}${w>=D.current_week?'':' · practice'}</button>`).join('')}</div>`;
 const entry=g=>{const v=gut.picks[g.id]?.m;const fav=v==null?null:v>0?'h':v<0?'a':'pk';
  const mine=t=>fav==null?'':fav==='pk'?'PK':(fav==='h')===(t===g.h)?'−'+Math.abs(v):'+'+Math.abs(v);
  const closed=live&&L.started(g);
  return `<li class="gi" data-g="${E(g.id)}"><div class="top"><small>${E(L.kick(g))}${g.n?' · neutral site':''}</small><small>${E(g.a)} ${rec(g.a)} · ${E(g.h)} ${rec(g.h)}</small></div>
  ${showScore(g)?scoreRow(g):''}
  ${closed?`<p class="note" style="margin:10px 0 4px">${badge(g.a,1)} ${E(g.a)} @ ${E(g.h)} ${badge(g.h,1)} — kicked off. Picks are closed for this game.</p>`:`
  <div class="tm2" role="group" aria-label="${E('Who is favored, '+g.a+' at '+g.h)}">
   <button class="team" data-f="a" aria-pressed="${fav==='a'}">${badge(g.a)}<span class="tn"><b>${E(g.a)}</b><span>${mine(g.a)||'away'}</span></span></button>
   <button class="team" data-f="h" aria-pressed="${fav==='h'}">${badge(g.h)}<span class="tn"><b>${E(g.h)}</b><span>${mine(g.h)||'home'}</span></span></button></div>
  <div class="adj"><button class="st" data-s="-1" aria-label="Half point less">−</button><output>${fav==null?'Pick a team':fav==='pk'?'Pick’em':(fav==='h'?g.h:g.a)+' −'+Math.abs(v)}</output><button class="st" data-s="1" aria-label="Half point more">+</button><button class="ev" data-f="pk" aria-pressed="${fav==='pk'}">Even</button></div>
  ${v!=null?`<button class="y revb" data-rev="${E(g.id)}">Reveal Vegas line</button>`:''}`}
  ${injBlock(g)}</li>`};
 const card=g=>{const v=gut.picks[g.id],l=v.rl??g.l,gl={...g,l},locked=st(g)==='D',diff=Math.round((v.m-l)*10)/10,read=diff===0?null:(diff>0?g.h:g.a);
  const yours=L.lineText(g,v.m),real=L.lineText(g,l),side=L.betSide(g,v),res=locked&&side?L.cover(g,side,l):null,u=v.u||1;
  const kind=!v.dec?'':v.dec==='fade'?'fade':v.dec==='pass'?'pass':'bet';
  const opts=read?[['bet','Bet it',L.betText(gl,read)],['fade','Fade',L.betText(gl,L.other(g,read))],['pass','Pass','stay away']]
                 :[['away',`Take ${g.a}`,L.betText(gl,g.a)],['home',`Take ${g.h}`,L.betText(gl,g.h)],['pass','Pass','stay away']];
  const readLine=read?`Your read: <b>${E(L.betText(gl,read))}</b>`:locked?'You matched Vegas exactly':'You matched Vegas exactly — pick a side or pass';
  let foot;
  if(!locked){
   foot=`<div class="dec" role="group" aria-label="${E('Decision for '+g.a+' at '+g.h)}">${opts.map(([d,t,sm])=>`<button data-dec="${d}" aria-pressed="${v.dec===d}">${E(t)}<small>${E(sm)}</small></button>`).join('')}</div>
    ${v.dec&&v.dec!=='pass'?`<div class="units" role="group" aria-label="Bet size"><span class="note">Size</span>${[1,2,3].map(n=>`<button data-u="${n}" aria-pressed="${u===n}">${n}u</button>`).join('')}</div>`:''}
    <button class="y revb" data-lockg="${E(g.id)}" ${v.dec?'':'disabled'}>${v.dec?'Lock this '+(v.dec==='pass'?'pass':'bet'):'Choose Bet it, Fade or Pass'}</button>`;
  } else {
   const what=side?`${E(L.betText(gl,side))} · ${u}u`:'Passed';
   const bb=v.bestB?` <span class="note">· best ${E(v.bestB.t)} ${E(L.sg(v.bestB.pt))} (${E(L.price(v.bestB.pr))})</span>`:'';
   const rawRes=read?L.cover(g,read,l):null;
   foot=`<div class="out"><span class="m">${what}</span>${res?`<span class="res ${res}">${res==='W'?'WIN':res==='L'?'LOSS':'PUSH'}</span>`:''}${bb}</div>${clvLine(g,v)}
    ${kind==='pass'&&rawRes?`<p class="note" style="margin:2px 0 0">Your read (${E(L.betText(gl,read))}) would have ${rawRes==='W'?'won':rawRes==='L'?'lost':'pushed'}.</p>`:''}
    ${kind==='fade'&&rawRes?`<p class="note" style="margin:2px 0 0">Your read (${E(L.betText(gl,read))}) went ${rawRes}.</p>`:''}`;
  }
  return `<article class="rc ${kind}" data-g="${E(g.id)}">
   <div class="rh"><span class="mt">${badge(g.a,1)}<span class="num">${E(g.a)} @ ${E(g.h)}</span>${badge(g.h,1)}</span><span class="gapb"><small>gap</small> ${Math.abs(diff).toFixed(1)}</span></div>
   <p class="note" style="margin:2px 0 0">${E(L.kick(g))}</p>
   ${showScore(g)?scoreRow(g)+verdict(g,v):''}
   <div class="vs"><div class="pill you"><small>YOU</small>${E(yours)}</div><div class="pill vegas"><small>VEGAS</small>${E(real)}</div></div>
   ${locked?'':bestBlock(g,l)}
   <p class="why">${readLine} <span class="note">· model ${E(L.lineText(g,Math.round(MP[g.i]*2)/2))}</span></p>
   ${foot}${injBlock(g)}</article>`};
 const open=games.filter(g=>st(g)!=='D'), done=games.filter(g=>st(g)==='D');
 const nSet=games.filter(g=>gut.picks[g.id]).length, nRev=games.filter(g=>'CD'.includes(st(g))).length;
 const grp=(k,t)=>{const list=done.filter(g=>{const d=gut.picks[g.id].dec||'pass';return k==='bet'?(d==='bet'||d==='home'||d==='away'):d===k});
  if(!list.length) return '';
  const r=k==='bet'?[L.betRecord(gut,{week:gutWk,dec:'bet'}),L.betRecord(gut,{week:gutWk,dec:'match'})].reduce((a,b)=>({w:a.w+b.w,l:a.l+b.l,p:a.p+b.p,n:a.n+b.n,units:Math.round((a.units+b.units)*10)/10})):L.betRecord(gut,{week:gutWk,dec:k});
  return `<section class="grp ${k}"><h3 class="gh2"><span>${t} <small>(${list.length})</small></span>${r.n?`<span>${L.rec(r)}${k!=='pass'?` · ${r.units>0?'+':''}${r.units}u`:' if bet'}</span>`:''}</h3>${list.map(card).join('')}</section>`};
 const br=L.betRecord(gut,{week:gutWk});
 const nB=open.filter(g=>st(g)==='B'&&!(live&&L.started(g))).length, nC=open.filter(g=>st(g)==='C'&&gut.picks[g.id].dec).length;
 return chips+`<p class="note">${live?'Set your line, reveal Vegas, then bet, fade or pass — one game at a time.':'Practice week: set your line and reveal one game at a time.'}</p>
 ${live?'':`<label class="bk" style="min-height:44px"><input type="checkbox" id="scG" ${SHOWSC?'checked':''}> Show final scores now <span class="note">(off = each score appears when you lock that game)</span></label>`}
 <div class="prog" aria-hidden="true"><i style="width:${games.length?nRev/games.length*100:0}%"></i></div>
 <p class="note" style="margin-top:4px">${nSet} set · ${nRev} revealed · ${done.length} locked of ${games.length}</p>
 ${br.n?readout({...L.grade([]),...br,suPct:null,mae:null}).replace('class="ro"','class="ro" style="position:static"'):''}
 ${(()=>{const c=L.closer(gut,{week:gutWk});return c.n?`<p class="note">Closer than Vegas this week: <b class="yel">${c.you} of ${c.n}</b>${c.nailed?` · ${c.nailed} nailed`:''}</p>`:''})()}
 ${open.length?`<div class="legend"><span class="pill you"><small>YOU</small>your line</span><span class="pill vegas"><small>VEGAS</small>real line</span></div>`:''}
 <ul class="gl">${open.map(g=>st(g)==='C'?`<li>${card(g)}</li>`:entry(g)).join('')}</ul>
 ${done.length?`<h2>Locked</h2>${grp('bet','Bets')}${grp('fade','Fades')}${grp('pass','Passes')}`:''}
 ${nSet?`<button id="resetWk" style="margin-top:12px">Start week ${gutWk} over</button>`:''}
 ${nB||nC?`<div class="act" style="grid-template-columns:${nB&&nC?'1fr 1fr':'minmax(0,1fr)'}">${nB?`<button class="y" data-act="revall">Reveal all set · ${nB}</button>`:''}${nC?`<button data-act="lockall">Lock all decided · ${nC}</button>`:''}</div>`:''}`;
}
function badge(t,sm){const c=L.TEAMC[t]||['#444','#888','#fff'];return `<span class="badge${sm?' sm':''}" style="background:${c[0]};color:${c[2]};--b2:${c[1]}" aria-hidden="true">${E(t)}</span>`}

function injBlock(g){
 if(!g.ihl&&!g.ial) return '';
 const side=sd=>{const it=(sd==='h'?g.ihl:g.ial)||[];return `<div><b>${E(sd==='h'?g.h:g.a)} · −${(sd==='h'?g.ih:g.ia).toFixed(1)} pts</b><ul>${it.map(p=>`<li>${E(p.n)} ${E(p.pos)} · <em>${E(p.st)}</em>${p.inj?' · '+E(p.inj):''}</li>`).join('')||'<li>No key absences</li>'}</ul></div>`};
 return `<details data-inj="${E(g.id)}"><summary><span class="pl">+ Injuries</span><span class="mi">− Injuries</span>&nbsp;<small class="note">(${E(g.a)} −${g.ia.toFixed(1)}, ${E(g.h)} −${g.ih.toFixed(1)} pts)</small></summary><div class="ir">${side('a')}${side('h')}</div></details>`;
}
function bestBlock(g,l){
 if(!g.bk) return '';
 const gl={...g,l},bk=L.store.state.books;
 const one=sd=>{const b=L.bestLine(g,sd,bk);if(!b)return `<div>${E(L.betText(gl,sd))}<b>—</b></div>`;const cons=sd===g.h?-l:l,gain=b.pt-cons;
  return `<div>Best for ${E(sd)}<b>${E(sd)} ${E(L.sg(b.pt))} <span style="font:500 13px Archivo,sans-serif">(${E(L.price(b.pr))})</span></b>${E(b.t)}${gain>0?` · <span style="color:var(--win);font-weight:700">+${gain} pt</span>`:''}</div>`};
 return `<div class="best2">${one(g.a)}${one(g.h)}</div>`;

function shopCell(x){

 const sc=$('#scT');if(sc)sc.onchange=()=>{SHOWSC=sc.checked;try{localStorage.setItem('gc.scores',SHOWSC?'1':'0')}catch(e){};toast('Saved')};
 const lt=$('#labT');if(lt)lt.onchange=()=>{LAB=lt.checked;try{localStorage.setItem('gc.lab',LAB?'1':'0')}catch(e){};render()};
 document.querySelectorAll('[data-pal]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>{setPal(b.dataset.pal);render()}});
 const de=$('#defE');if(de)de.onchange=e=>{minE=Math.max(0,+e.target.value||0);try{localStorage.setItem('gc.minE',minE)}catch(_){};toast('Saved')};
 const msg={week:`Erase week ${L.D.current_week} picks? Tap again`,gut:'Erase ALL gut picks? Tap again',prof:'Delete your saved playbooks? Tap again'};
 document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const k=b.dataset.reset;if(!b.dataset.sure){b.dataset.sure=1;b.textContent=msg[k];return}
  if(k==='week')L.store.resetWeek(L.D.current_week);if(k==='gut')L.store.resetGut();if(k==='prof'){L.store.deleteAllProfiles();prof=null;pickId=null}
  toast('Done');render()});
}

let LAB=false;try{LAB=localStorage.getItem('gc.lab')==='1'}catch(e){}
function renderTabs(){const t=[['gut','Gut Instincts'],['record','My Record'],...(LAB?[['build','Playbook'],['picks','Picks'],['board','Standings']]:[]),['settings','<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:-3px;margin-right:4px"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings']];
 if(!t.some(x=>x[0]===view))view='gut';
 document.getElementById('tabs').innerHTML=t.map(([v,n])=>`<button role="tab" data-v="${v}" aria-selected="${v===view}">${n}</button>`).join('');}

function render(){
 renderTabs();
 const m=$('#main');
 if(view==='build'){m.innerHTML=build();bindBuild()}else if(view==='gut'){m.innerHTML=gut();bindGut()}else if(view==='picks'){m.innerHTML=picksView();bindPicks()}else if(view==='settings'){m.innerHTML=settingsView();bindSettings()}else if(view==='record'){m.innerHTML=recordView();bindRecord()}else{m.innerHTML=board();bindBoard()}
}
const PALS=[['stadium','Stadium','#15171c','#2c323d','#ff8a1f'],['concrete','Concrete','#c5c9ce','#f7f8f9','#d0141c'],['contrast','High contrast','#000000','#ffffff','#ffe600'],['chalk','Chalkboard','#111614','#2a3630','#ffd84a'],['turf','Turf','#0e3a22','#1a5c37','#ffffff'],['day','Day game','#eceff3','#ffffff','#0b5cd6']];
const setPal=v=>{if(!PALS.some(p=>p[0]===v))v='stadium';document.documentElement.dataset.pal=v;const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();try{localStorage.setItem('gc.pal',v)}catch(e){}};
try{setPal(localStorage.getItem('gc.pal')||'stadium')}catch(e){setPal('stadium')}
try{const m=localStorage.getItem('gc.minE');if(m!=null)minE=+m||0}catch(e){}
L.load('data.json').then(()=>L.store.init(()=>render())).catch(e=>{$('#main').innerHTML='<p class="note">Could not load data.</p>';console.error(e)});
}</script></body></html>
